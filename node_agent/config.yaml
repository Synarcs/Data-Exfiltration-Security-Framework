# store the stream client lb ipv4 and ipv6 for message broker (kafka)
streamServers:
  host: cssvlab01.uwb.edu
  ip: 10.158.82.6 
  port: 9092

# store the enterprise powerdns server 
# uses internally the pdns recursor for fast concurrent query processing 
dnsServer:
  host: cssvlab08.uwb.edu
  ip: 10.158.82.55
  port: 8082


# store the metric server (prmetheus exporters running to scrape info) ipv4 and ipv6 
metricServer:
  host: cssvlab01.uwb.edu
  ip: 10.158.82.6 
  port: 9090


# service grafnaa viz exporter for dashboard UI
grafanaServer: 
  host: cssvlab01.uwb.edu
  ip: 10.158.82.6  
  port: 3000
  

# prometheus custom local metrics exporter 
metricsExporter:
  port: 3232 # host is the local node exporting metrics whcih this centralized metric server can scrape 
  ip: 0.0.0.0 # service local phsical inet net_device link bind from kernel 

inference:
  ingressSock: "/run/dnsobelisk/onnx-inference-in.sock"
  egressSock: "/run/dnsobelisk/onnx-inference-out.sock"

disableExporters:
  streaming: false
  metrics:: false

rlimitConfig:
  tb:
    maxTokens: 10000

# Add the tb volume config for volume based rate limit over egress tc in kernel 

enhancedFeatures:
  l3: # for l3 filtering to stop exfiltration over other protocols which c2 server remote server ip can be used to exftract data via other tunnel protocols 
    enabledL3v4Filtering: true 
    enabledL3v6Filtering: true 
  dns:
    enableNxFloodPrevention: false 
    enableIngressSniff: true 
    enabledTbRlimit: false
    enabbledVolumeRlimit: false