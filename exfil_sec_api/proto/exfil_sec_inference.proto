syntax = "proto3";

import "google/protobuf/empty.proto";
package exfil_kernel;

option go_package = "github.com/Synarcs/Data-Exfiltration-Security-Framework/exfil_sec_api;exfil_sec_api";

message DnsFeatures {
    repeated float features = 1;
}

message DnsInferenceRequest {
    repeated DnsFeatures reshaped = 1; // features over rpc are reshaped adhere to shape for inference request 
}

message DnsInferenceResponseIngress {
    repeated bool threatType = 1;
    string protocol = 2;
}

message DnsInferenceResponseEgress {
    bool threatType = 1;
}

message ServiceHeartBeatVersion {
    string version = 1;
}

service DNSOnnxInferenceService {
    rpc IngressInfer(DnsInferenceRequest) returns (DnsInferenceResponseIngress);
    rpc EgressInfer(DnsInferenceRequest) returns (DnsInferenceResponseEgress);
    rpc VersionInfo(google.protobuf.Empty) returns (ServiceHeartBeatVersion);
}